# 本地开发用的依赖容器：PostgreSQL + Redis（MySQL 走 profile 按需启动）。
#
# 这里只提供外部依赖，应用在宿主机上跑（改代码即热重载），不构建也不运行应用本体。
# 开发默认并不需要它们（config.yaml 走 SQLite + 内存缓存），起它们是为了验证换库 / 换缓存，
# 配套 task server:dev:pg、task server:dev:mysql。生产编排见 deployments/docker-compose.yml，
# 两个文件的账号、卷、网络都不共用（dev 是公开的开发值，prod 走 .env）。
#
#   docker compose -f docker-compose.dev.yml up -d                  # postgres + redis
#   docker compose -f docker-compose.dev.yml --profile mysql up -d  # 额外启动 mysql
#   docker compose -f docker-compose.dev.yml down                   # 停止并移除容器（数据卷保留）

# 项目名固定，卷前缀因此稳定为 gowork-dev_*。此前文件在 deployments/ 下时前缀是
# deployments_*，旧卷不会被自动接管，换库验证的数据要重灌一次。
name: gowork-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: gowork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gowork
      POSTGRES_USER: gowork
      POSTGRES_PASSWORD: gowork
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gowork -d gowork']
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: gowork-mysql
    restart: unless-stopped
    profiles: ['mysql']
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: gowork
      MYSQL_USER: gowork
      MYSQL_PASSWORD: gowork
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-pgowork']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gowork-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

# 数据卷只用于「换库验证」期间保留数据，随时可以 down -v 重来。
volumes:
  pg-data:
  mysql-data:
  redis-data:
