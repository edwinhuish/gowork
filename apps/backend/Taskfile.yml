version: '3'

vars:
  BIN_DIR: bin
  APP_NAME: gowork-server
  CONFIG_FILE: configs/config.yaml
  AIR_VERSION: v1.67.4
  AIR_CONFIG: .air.toml

tasks:
  default:
    desc: 列出后端可用任务
    silent: true
    cmds:
      - task --list

  install:
    desc: 下载 Go 依赖并整理 go.mod
    cmds:
      - go mod download
      - go mod tidy

  tidy:
    desc: 仅整理 go.mod / go.sum
    cmds:
      - go mod tidy

  build:
    desc: 编译到 bin/
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -trimpath -ldflags "-s -w" -o {{.BIN_DIR}}/{{.APP_NAME}} ./cmd/server

  dev:
    desc: 热重载启动（air 监听 *.go 变更 → 重新编译 → 自动重启；SQLite + 内存缓存）
    preconditions:
      - sh: command -v air
        msg: '未找到 air：先执行 task backend:tool:air（或 go install github.com/air-verse/air@{{.AIR_VERSION}}）'
    cmds:
      - mkdir -p data
      - air -c {{.AIR_CONFIG}}

  dev:once:
    desc: 单次启动、不监听变更（改启动流程 / 没有 air 时用）
    cmds:
      - mkdir -p data
      - go run ./cmd/server -config {{.CONFIG_FILE}}

  dev:pg:
    desc: 以 PostgreSQL + Redis 热重载启动，需先 task infra:up
    preconditions:
      - sh: command -v air
        msg: '未找到 air：先执行 task backend:tool:air（或 go install github.com/air-verse/air@{{.AIR_VERSION}}）'
    cmds:
      # `--` 之后的参数由 air 追加给被启动的二进制（.air.toml 的 entrypoint 不带参数，
      # 默认走 main.go 里 -config 的 configs/config.yaml；这里补一个 -config 换库）。
      - air -c {{.AIR_CONFIG}} -- -config configs/config.postgres.yaml

  dev:mysql:
    desc: 以 MySQL + Redis 热重载启动，需先 task infra:up AND docker compose --profile mysql up -d
    preconditions:
      - sh: command -v air
        msg: '未找到 air：先执行 task backend:tool:air（或 go install github.com/air-verse/air@{{.AIR_VERSION}}）'
    cmds:
      - air -c {{.AIR_CONFIG}} -- -config configs/config.mysql.yaml

  tool:air:
    desc: 安装 air（版本锁在 vars.AIR_VERSION；走 go install，不进 go.mod）
    cmds:
      - go install github.com/air-verse/air@{{.AIR_VERSION}}

  run:
    desc: 运行已编译的二进制
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}} -config {{.CONFIG_FILE}}

  test:
    desc: 运行单元测试（sqlite + memory 用例始终执行，外部依赖用例自动跳过）
    cmds:
      - go test ./... -count=1

  test:storage:
    desc: 存储一致性测试：同一套断言跑 SQLite/PostgreSQL/MySQL 与 memory/redis
    env:
      GOWORK_TEST_PG_DSN: '{{.PG_DSN | default "host=127.0.0.1 port=5432 user=gowork password=gowork dbname=gowork sslmode=disable"}}'
      GOWORK_TEST_MYSQL_DSN: '{{.MYSQL_DSN | default "gowork:gowork@tcp(127.0.0.1:3306)/gowork?charset=utf8mb4&parseTime=True&loc=Local"}}'
      GOWORK_TEST_REDIS_ADDR: '{{.REDIS_ADDR | default "127.0.0.1:6379"}}'
    cmds:
      - go test ./internal/... -count=1 -run 'TestStorage|TestCache' -v

  vet:
    desc: 静态检查
    cmds:
      - go vet ./...

  fmt:
    desc: 格式化代码
    cmds:
      - gofmt -w .

  clean:
    desc: 清理编译产物
    cmds:
      - rm -rf {{.BIN_DIR}}
