# 生产配置模板：PostgreSQL + Redis。
#
# 密码一律通过环境变量注入，不要写进仓库：
#   GOWORK_DB_PASSWORD、GOWORK_REDIS_PASSWORD、GOWORK_JWT_SECRET
# 换 MySQL：driver 改成 mysql、port 改成 3306，字段名完全不变，
# 但 params 要换成 mysql 的 query string 写法（见 config.mysql.yaml）。
#
# 单机 compose 部署不用这份文件：那边把 deployments/config.prod.yaml 只读挂到
# 这个路径上覆盖它（库在同机容器、没有 TLS、空库首启要建表，取值不同）。

app:
  name: gowork
  env: prod

http:
  addr: ":8080"
  mode: release
  cors_origins:
    - https://erp.example.com
  shutdown_timeout: 15

# 连接数据库：字段逐个填，换库只改 driver（params 的写法也要跟着换）。
# 也可以用一行 dsn 覆盖整段连接串，此时下面这些字段全部被忽略。
database:
  driver: postgres      # postgres | mysql（生产用这两种）
  host: postgres        # 库地址：同机容器写服务名，外部库写内网域名
  port: 5432            # postgres 默认 5432，mysql 默认 3306，可省略
  name: gowork          # 要连的库名（不是账号名）
  # 这两个才是登录凭据，与上面的 name 无关。
  username: gowork      # 登录账号
  password: ""          # 密码不进仓库：由环境变量 GOWORK_DB_PASSWORD 注入
  # params 按驱动解释：postgres 是 key=value，mysql 是 query string。
  params:
    sslmode: require    # 托管库基本都强制 TLS；内网无证书时改 disable
    TimeZone: Asia/Shanghai
  max_open: 100
  max_idle: 20
  max_lifetime: 3600
  log_level: warn
  auto_migrate: false
  seed: false

cache:
  driver: redis
  prefix: "gowork:"
  # 生产不允许静默降级：多实例部署下退回进程内缓存会造成数据不一致。
  fallback_to_memory: false
  redis:
    addr: "redis:6379"
    password: ""
    db: 0
    dial_timeout: 2
  memory:
    persist: false

jwt:
  secret: ""
  expire: 12

log:
  level: info
  format: json
