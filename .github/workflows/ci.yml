# 之前仓库没有 CI，这份是随 pnpm 迁移一起加的：把「本地怎么装、CI 就怎么装」固定下来。
#
# 关键点：前端安装只认 pnpm-lock.yaml（--frozen-lockfile），
# 锁文件和 package.json 对不上时 CI 直接红，而不是悄悄解析出新版本。

name: CI

on:
  # 不按分支名过滤：本仓库主干是 master，一旦改名或换成 main，
  # 写成 branches: [main] 会静默不触发，比"多跑几个分支"麻烦得多。
  push:
  pull_request:

# 同一分支连续提交时取消上一次运行，省 runner 也避免旧结果误导
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: 下载依赖
        run: go mod download

      - name: 编译
        run: go build ./...

      - name: 静态检查
        run: go vet ./...

      # 格式漂移不影响构建，却会让编辑器每次打开都提示，久了就没人再看那条提示。
      # 不在这里拦，就只能靠人自觉——而这条恰好是"改了但忘了跑 gofmt"最容易漏的。
      - name: 格式检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化，本地跑 gofmt -w 修掉："
            echo "$out"
            exit 1
          fi

      - name: 单元测试
        run: go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm 版本从 apps/frontend/package.json 的 packageManager 读，
      # 不在这里写死版本号，避免和本地 / corepack 各说一套。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/frontend/package.json
          cache: true
          cache_dependency_path: apps/frontend/pnpm-lock.yaml

      # engines 允许 node>=20，这里固定一个版本跑，保证结果可重复
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖（严格按锁文件）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm run typecheck

      - name: 构建
        run: pnpm run build

  # 「换存储不改代码」是这套架构的一条承诺（三个 dialect + 两套缓存）。
  # 只在本机跑过不算数：开发机的容器版本、初始化参数都和别人不一样，
  # 而 sqlite 上永远绿、postgres 上才炸的那类问题，正是这一套要拦的。
  storage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gowork
          POSTGRES_USER: gowork
          POSTGRES_PASSWORD: gowork
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gowork -d gowork"
          --health-interval 5s --health-timeout 3s --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gowork
          MYSQL_USER: gowork
          MYSQL_PASSWORD: gowork
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ugowork -pgowork"
          --health-interval 10s --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum

      - name: 下载依赖
        run: go mod download

      # DSN 与 test:storage 任务里的默认值保持一致：两处不一致时，
      # "本地过、CI 不过"会变成排查常客。
      - name: 存储一致性测试
        env:
          GOWORK_TEST_PG_DSN: 'host=127.0.0.1 port=5432 user=gowork password=gowork dbname=gowork sslmode=disable'
          GOWORK_TEST_MYSQL_DSN: 'gowork:gowork@tcp(127.0.0.1:3306)/gowork?charset=utf8mb4&parseTime=True&loc=Local'
          GOWORK_TEST_REDIS_ADDR: '127.0.0.1:6379'
        run: go test ./internal/... -count=1 -run 'TestStorage|TestCache'
